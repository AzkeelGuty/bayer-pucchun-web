name: Quality checks

on:
  push:
    branches:
      - integration/frontend-equipo
      - 'ux/**'
  pull_request:
    branches:
      - integration/frontend-equipo

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          find app config routes public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        shell: bash
        run: |
          find public/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validator unit test
        run: php -d assert.exception=1 tests/unit/validator_test.php
